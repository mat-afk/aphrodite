services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"

    volumes:
      - /home/arduino/aphrodite-data/adguard/work:/opt/adguardhome/work
      - /home/arduino/aphrodite-data/adguard/conf:/opt/adguardhome/conf

    networks:
      - default
      - aphrodite

networks:
  aphrodite:
    external: true
